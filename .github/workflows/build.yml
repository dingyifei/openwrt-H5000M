name: 构建 H5000M 官方基础固件

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  # Build on every push to master too. Under the rolling model the snapshot moves
  # continuously, so "the firmware for master" is only meaningful if master rebuilds
  # itself; without this, merging a change produced no artifact until someone opened a
  # PR or dispatched the workflow by hand.
  push:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: 主包边界检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 检查仓库结构与配置
        run: ./scripts/check-main-package.sh

  build:
    name: 官方 ImageBuilder
    needs: check
    # GitHub-hosted x86_64 runner: native architecture for the ImageBuilder host
    # tools, and a reliable network for the OpenWrt snapshot mirrors. No Docker
    # or Rosetta needed here (that path is only for Apple Silicon local builds).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools zstd

      - name: 构建并验证基础固件
        env:
          # Rolling mode: the OpenWrt snapshot mirror rolls ~hourly, so a fixed
          # pin is not fetchable for long. CI tracks the live snapshot and still
          # enforces every product invariant (plugin key, wifi defaults, single
          # wpad-openssl provider, forbidden-package denylist, compact dnsmasq).
          OPENWRT_ROLLING: "1"
          OPENWRT_LOCAL_CACHE: ${{ runner.temp }}/openwrt-official-cache
          OPENWRT_LOCAL_ARTIFACTS: ${{ github.workspace }}/artifacts
        run: ./scripts/build-official-base-local.sh

      - name: 上传基础固件
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-official-base
          path: artifacts/H5000M-official-base-*/
          if-no-files-found: error
          retention-days: 14

      # --- optional second artifact: base + signed plugins -------------------------
      # The clean base above is already built, asserted and uploaded; nothing below can
      # affect it. Both steps are best-effort on purpose: the plugin repo is built against
      # whatever snapshot was current when the plugins repo last ran, and under the rolling
      # model the mirror may have moved since. When the kernel ABIs disagree the loaded
      # image MUST fail rather than ship kmods that install cleanly and never load - so the
      # ABI gate failing here is correct behaviour, not a broken build, and the clean base
      # is still published.
      - name: 获取插件离线仓库
        id: plugins
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.H5000M_PLUGIN_ARTIFACT_TOKEN || github.token }}
        run: |
          set -eu
          run_id="$(gh run list --repo dingyifei/openwrt-H5000M-plugins \
            --workflow build.yml --branch master --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          [ -n "${run_id:-}" ] || { echo "::warning::no successful plugin build; loaded image SKIPPED"; exit 1; }
          gh run download "$run_id" --repo dingyifei/openwrt-H5000M-plugins \
            --name offline-repo --dir plugin-repo
          [ -s plugin-repo/PROVENANCE.txt ] || { echo "::warning::plugin artifact has no PROVENANCE.txt"; exit 1; }
          echo "dir=$(cd plugin-repo && pwd)" >> "$GITHUB_OUTPUT"
          sed -n 's/^kernel_abi=/plugin abi /p;s/^revision=/plugin rev /p' plugin-repo/PROVENANCE.txt

      - name: 构建完整固件（基础 + 插件）
        id: loaded
        if: steps.plugins.outcome == 'success'
        continue-on-error: true
        env:
          OPENWRT_ROLLING: "1"
          OPENWRT_LOCAL_CACHE: ${{ runner.temp }}/openwrt-official-cache
          OPENWRT_LOCAL_ARTIFACTS: ${{ github.workspace }}/artifacts
          H5000M_LOADED_IMAGE: "1"
          H5000M_PLUGIN_REPO: ${{ steps.plugins.outputs.dir }}
        run: ./scripts/build-official-base-local.sh

      - name: 上传完整固件
        if: steps.loaded.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-loaded
          path: artifacts/H5000M-loaded-*/
          if-no-files-found: error
          retention-days: 14

      - name: 报告完整固件状态
        if: steps.plugins.outcome != 'success' || steps.loaded.outcome != 'success'
        run: |
          echo "::warning::loaded image not produced (plugins: ${{ steps.plugins.outcome }}, build: ${{ steps.loaded.outcome }})"
          echo "The clean base above is unaffected. The usual cause is a kernel-ABI mismatch:"
          echo "the plugin repo was built against an older snapshot. Re-run the plugins"
          echo "workflow so both halves resolve against the current snapshot."
