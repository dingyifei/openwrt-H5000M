name: 构建 H5000M 官方基础固件

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  # Build on every push to master too. Under the rolling model the snapshot moves
  # continuously, so "the firmware for master" is only meaningful if master rebuilds
  # itself; without this, merging a change produced no artifact until someone opened a
  # PR or dispatched the workflow by hand.
  push:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: 主包边界检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 检查仓库结构与配置
        run: ./scripts/check-main-package.sh

  build:
    name: 官方 ImageBuilder
    needs: check
    # GitHub-hosted x86_64 runner: native architecture for the ImageBuilder host
    # tools, and a reliable network for the OpenWrt snapshot mirrors. No Docker
    # or Rosetta needed here (that path is only for Apple Silicon local builds).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools zstd

      - name: 构建并验证基础固件
        env:
          # Rolling mode: the OpenWrt snapshot mirror rolls ~hourly, so a fixed
          # pin is not fetchable for long. CI tracks the live snapshot and still
          # enforces every product invariant (plugin key, wifi defaults, single
          # wpad-openssl provider, forbidden-package denylist, compact dnsmasq).
          OPENWRT_ROLLING: "1"
          OPENWRT_LOCAL_CACHE: ${{ runner.temp }}/openwrt-official-cache
          OPENWRT_LOCAL_ARTIFACTS: ${{ github.workspace }}/artifacts
        run: ./scripts/build-official-base-local.sh

      - name: 上传基础固件
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-official-base
          path: artifacts/H5000M-official-base-*/
          if-no-files-found: error
          retention-days: 14

      # --- optional second artifact: base + signed plugins -------------------------
      # The clean base above is already built, asserted and uploaded; nothing below can
      # affect it. Both steps are best-effort on purpose: the plugin repo is built against
      # whatever snapshot was current when the plugins repo last ran, and under the rolling
      # model the mirror may have moved since. When the kernel ABIs disagree the loaded
      # image MUST fail rather than ship kmods that install cleanly and never load - so the
      # ABI gate failing here is correct behaviour, not a broken build, and the clean base
      # is still published.
      - name: 获取插件离线仓库
        id: plugins
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.H5000M_PLUGIN_ARTIFACT_TOKEN || github.token }}
        run: |
          set -eu
          repo=dingyifei/openwrt-H5000M-plugins

          # Take the build for the plugin repo's CURRENT master HEAD, not merely the most
          # recent successful run. Those differ whenever both repos are pushed together:
          # the plugins build is still running when this step queries, so "latest success"
          # is the PREVIOUS commit and the loaded image silently ships stale plugins. That
          # happened twice on 2026-07-26 - once shipping a dialer without the APN-type
          # ladder - and left no trace, because the build succeeds either way.
          head_sha="$(gh api "repos/${repo}/commits/master" --jq '.sha' 2>/dev/null || true)"
          [ -n "${head_sha:-}" ] || { echo "::warning::cannot resolve plugin master HEAD; loaded image SKIPPED"; exit 1; }
          echo "plugin master HEAD ${head_sha}"

          # The plugins build for that SHA may still be in flight; wait a bounded time
          # rather than racing it. ~10 min covers a cold plugin build with room to spare.
          run_id=''
          for _ in $(seq 1 40); do
            run_id="$(gh run list --repo "$repo" --workflow build.yml \
              --commit "$head_sha" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
            [ -n "${run_id:-}" ] && break
            # Stop early if that SHA's run has already finished UNSUCCESSFULLY - waiting
            # out the full timeout would only delay the same failure.
            state="$(gh run list --repo "$repo" --workflow build.yml \
              --commit "$head_sha" --limit 1 \
              --json status,conclusion --jq '"\(.[0].status)/\(.[0].conclusion)"' 2>/dev/null || true)"
            case "$state" in
              # ⚠️ completed/success MUST fall through to another poll, not be treated as
              # terminal-bad. `gh run list --status success` lags the run's own completion by
              # a few seconds, so on the very iteration the plugins build finishes WELL, the
              # run-id query above can still return empty while this query already says
              # "completed/success". A bare `completed/*)` arm therefore aborted on SUCCESS -
              # and it fired exactly when both repos are pushed together, which is the normal
              # case this whole polling loop exists to handle. Measured: the 2026-07-28 base
              # build skipped the loaded image with "ended completed/success".
              completed/success) : ;;
              completed/*) echo "::warning::plugin build for ${head_sha} ended ${state}; loaded image SKIPPED"; exit 1 ;;
            esac
            echo "waiting for plugin build of ${head_sha} (state ${state:-unknown})"
            sleep 15
          done
          [ -n "${run_id:-}" ] || { echo "::warning::no successful plugin build for ${head_sha}; loaded image SKIPPED"; exit 1; }

          gh run download "$run_id" --repo "$repo" --name offline-repo --dir plugin-repo
          [ -s plugin-repo/PROVENANCE.txt ] || { echo "::warning::plugin artifact has no PROVENANCE.txt"; exit 1; }
          echo "dir=$(cd plugin-repo && pwd)" >> "$GITHUB_OUTPUT"
          echo "plugin commit ${head_sha}"
          sed -n 's/^kernel_abi=/plugin abi /p;s/^revision=/plugin rev /p' plugin-repo/PROVENANCE.txt

      - name: 构建完整固件（基础 + 插件）
        id: loaded
        if: steps.plugins.outcome == 'success'
        continue-on-error: true
        env:
          OPENWRT_ROLLING: "1"
          OPENWRT_LOCAL_CACHE: ${{ runner.temp }}/openwrt-official-cache
          OPENWRT_LOCAL_ARTIFACTS: ${{ github.workspace }}/artifacts
          H5000M_LOADED_IMAGE: "1"
          H5000M_PLUGIN_REPO: ${{ steps.plugins.outputs.dir }}
        run: ./scripts/build-official-base-local.sh

      - name: 上传完整固件
        if: steps.loaded.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-loaded
          path: artifacts/H5000M-loaded-*/
          if-no-files-found: error
          retention-days: 14

      - name: 报告完整固件状态
        if: steps.plugins.outcome != 'success' || steps.loaded.outcome != 'success'
        run: |
          echo "::warning::loaded image not produced (plugins: ${{ steps.plugins.outcome }}, build: ${{ steps.loaded.outcome }})"
          echo "The clean base above is unaffected. The usual cause is a kernel-ABI mismatch:"
          echo "the plugin repo was built against an older snapshot. Re-run the plugins"
          echo "workflow so both halves resolve against the current snapshot."
